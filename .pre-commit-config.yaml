# pre-commit hooks. Установка: pip install pre-commit && pre-commit install.
# Прогон по всему дереву: pre-commit run --all-files.
#
# Пути ниже — под backend/-и-frontend/-layout (git-root = корень проекта).
# Поправь files:/exclude:/entry: и путь к venv (.venv) под свою структуру.
# Скрипт-хуки читают структуру из env LINT_PY_SRC/LINT_FE_DIR/... (см. §6 документа) —
# задай их здесь через `entry: bash -c 'LINT_PY_SRC=... && …'`, если дефолты не подходят.
#
# --- НАСТРОЙКА ПОД ЭТОТ ПРОЕКТ (CQG §6) -------------------------------------
# Прод-Python лежит в backend/app, а не в дефолтном backend/features, поэтому
# каждому скрипт-хуку ниже явно передаётся LINT_PY_SRC=backend/app. Без этого
# гейты сканировали бы несуществующий каталог и были бы ЗЕЛЁНЫМИ ВПУСТУЮ (§6,
# «0 файлов просканировано» — хуже красного).
#   LINT_PY_SRC=backend/app · LINT_FE_DIR=frontend (дефолт)
#   LINT_BE_DIR=backend (дефолт) · LINT_COV_PKG=app · LINT_VENV=.venv (дефолт)
# ----------------------------------------------------------------------------

default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  # -------------------------------------------------------------------------
  # Python: ruff (lint + format) — под backend.
  # -------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # -------------------------------------------------------------------------
  # Python: mypy strict на изменённых файлах через проектный venv (local hook,
  # НЕ mirrors-mypy: у того изолированное venv без проектных плагинов/модулей).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      # АДАПТАЦИЯ ПРОЕКТА: пакет целиком, а не список изменённых файлов.
      # Канонический вариант (pass_filenames: true) на --all-files разбивается
      # pre-commit'ом на батчи, и mypy 2.1.0 падает на одном из них с
      # `INTERNAL ERROR` (в CI: один батч — «Success: 22 files», другой — краш;
      # локально та же команда на всех 45 файлах проходит). Корень — взаимодействие
      # батч-сплита с `packages = ["app"]` в pyproject: mypy получает и явные файлы,
      # и сконфигурированный пакет.
      # Прогон пакета детерминирован и совпадает с `run_checks.sh` / `ci.yml`.
      - id: mypy
        name: mypy strict (пакет app)
        language: system
        types_or: [python]
        files: ^backend/
        exclude: /tests/
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && .venv/bin/mypy --config-file pyproject.toml'
        pass_filenames: false

  # -------------------------------------------------------------------------
  # TypeScript / React: ESLint (per-file errors) + warning-ратчет + Prettier.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (TypeScript)
        language: system
        types_or: [ts, tsx]
        files: ^frontend/src/
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && files=(); for f in "$@"; do files+=("${f#frontend/}"); done; npx --no-install eslint "${files[@]}"' --
        pass_filenames: true

      - id: eslint-warning-ratchet
        name: ESLint warnings — рост запрещён (count-ratchet)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_eslint_warnings.sh'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: Prettier (TypeScript / JSON / CSS)
        language: system
        types_or: [ts, tsx, javascript, json, css]
        files: ^frontend/src/
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && files=(); for f in "$@"; do files+=("${f#frontend/}"); done; npx --no-install prettier --check "${files[@]}"' --
        pass_filenames: true

  # -------------------------------------------------------------------------
  # Файлы кода: prod <= 500 / tests <= 1000 строк (baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: file-length
        name: Файлы кода <= 500/1000 строк (baseline-ratchet)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/lint/check_file_length.sh'
        types_or: [python, ts, tsx]
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Греп-гейты конвенций (per-file baseline-ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: config-access-gate
        name: config-access — типизированный config.X, не getattr/os.getenv
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule config-access'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: di-indirection-gate
        name: di-indirection — без pkg/session/ctx Any и importlib reach-back
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule di-indirection'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: service-no-web-gate
        name: service-no-web — сервис-слой не импортирует web-фреймворк
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule service-no-web'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: no-grab-bag-module-gate
        name: no-grab-bag — utils/misc/common/helpers.py без темы запрещены
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_grep_gate.sh --rule no-grab-bag-module'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: silent-except-gate
        name: silent-except — broad-except без raise/лога (AST)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app backend/.venv/bin/python scripts/lint/check_ast_gate.py --rule silent-except'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: inline-prompt-gate
        name: inline-prompt — LLM-промпт инлайном в .py (AST)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app backend/.venv/bin/python scripts/lint/check_ast_gate.py --rule inline-prompt'
        files: ^backend/.*\.py$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # DRY / copy-paste гейт (jscpd clone-count ratchet).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: jscpd-dry-gate
        name: DRY — рост копипаста (jscpd clone-count ratchet)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && LINT_PY_SRC=backend/app bash scripts/lint/check_jscpd_gate.sh'
        files: ^backend/.*\.py$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # import-linter — направление зависимостей между слоями.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter — dependency direction
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && ./.venv/bin/lint-imports'
        files: ^backend/.*\.py$
        pass_filenames: false

  # -------------------------------------------------------------------------
  # YAML парсится. Не косметика: workflow, который не парсится, GitHub не
  # запускает вовсе — гейт молча мёртв, а в списке прогонов вместо имени видно
  # путь к файлу. Именно так на этом развёртывании 40 минут «работал»
  # несуществующий main-guard (незакавыченное ": " в имени шага).
  # -------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        files: '^(\.github/workflows/|\.pre-commit-config\.yaml$)'
      - id: check-json
        files: '^frontend/(package\.json|\.prettierrc)$'

  # -------------------------------------------------------------------------
  # Вендоренная копия канонов не разошлась (AGENT_STACK §7.1, вариант C).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: canon-vendor
        name: docs/canon — копия канонов синхронна и парсится
        language: system
        entry: bash scripts/lint/check_canon_vendor.sh
        files: '^(docs/canon/|Prepare/|scripts/stack_selftest\.py)'
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Secrets — mechanical; не замена HITL Delivery (§2.7).
  # -------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # data/sessions/ приватен и gitignored; frontend-локи шумят на хешах.
        exclude: '^(frontend/package-lock\.json|backend/uv\.lock|docs/canon/)'

  # -------------------------------------------------------------------------
  # pre-push (§8.5.1 ③): тяжёлые проверки, поднимающие цену обхода.
  # Обходится `git push --no-verify` — осознанное действие, видимое в reflog.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: delivery-gate
        name: delivery phase gate + breakers (pre-push)
        entry: bash -c 'PY=$(command -v python3 || command -v python); "$PY" scripts/delivery_check.py --diff-base "$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo origin/main)"'
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: baseline-ratchet
        name: baseline only melts (pre-push)
        entry: bash scripts/lint/check_baseline_ratchet.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: smoke-evals
        name: product smoke oracles (pre-push)
        entry: bash delivery/evals/smoke/run.sh
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Мета-гейт — ПОСЛЕДНИМ. Проверяет, что все гейты выше вообще подключены:
  # забытый в этом файле скрипт молча не работает (§3, gate-coverage).
  - repo: local
    hooks:
      - id: gate-coverage
        name: every gate script is wired into pre-commit/CI
        entry: bash scripts/lint/check_gate_coverage.sh
        language: system
        pass_filenames: false
        always_run: true
