# дословным фрагментом и нужной правкой >= 80%; бедная — заметка на плоский фрагмент
# >= 70%; смешанная — заметка об ошибке >= 75%; невнятная — без заметки >= 75%.
# Живой прогон — только по «запускай» человека (run.py).

