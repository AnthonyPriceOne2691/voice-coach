[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-interview-coach"
version = "0.1.0"
description = "Local voice mock technical interview coach"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "jinja2>=3.1",
  "soundfile>=0.12",
  "piper-tts>=1.2",
]

[project.optional-dependencies]
vad = ["onnxruntime>=1.20"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--strict-markers",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-fail-under=85",  # Phase 2 gate (doc 18)
  # Зависший тест обязан падать, а не молчать. WS-тесты на TestClient блокируются
  # навсегда, если сервер не прислал ожидаемый кадр: прогоны main от 2026-07-05
  # висели по 6 ч и отменялись по лимиту. Локально сьют идёт ~2 с, так что 60 с
  # на тест — это только про «повис», а не про «медленно».
  "--timeout=60",
  "--timeout-method=thread",
]
markers = [
  "integration: hits multiple layers (still mocked external AI)",
  "slow: manual or e2e; not run in default CI",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/main.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["migrations", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","DTZ"]
ignore = [
    "E501",                 # длину разрулит форматтер
    "S101",                 # assert разрешён
    "S104","S105","S106","S301","S311","S324","S603","S607",  # bandit-шум / осознанные кейсы
    "PLR0913",              # too-many-args — web-фреймворк DI часто > 5
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default аргумента (напр. FastAPI Depends())
    "RUF001","RUF002","RUF003",  # ambiguous unicode — не-ASCII в строках/логах
    "PLC0415",              # import-outside-top-level — осознанный lazy-import паттерн
]
# tests-код имеет свои послабления:
# ASYNC добавлен к каноническому списку: тестовые фейки синхронно пишут файлы
# в async-методах, имитируя контракт реального декодера — это не блокирующий I/O в проде.
per-file-ignores = { "tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","C901","PLC0415","B017","PT011","PT012","PT018","N806","N803","N802","E402","SIM117","PT006","E741","PLW0108","DTZ","ASYNC"] }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "piper.*"
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "import-linter>=2.13",
  "pre-commit>=4.6.1",
  "detect-secrets>=1.5.0",
  "pytest-timeout>=2.4.0",
]
