[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-interview-coach"
version = "0.1.0"
description = "Local voice mock technical interview coach"
# readme НЕ указывается: единственный README лежит в корне репозитория, а
# hatchling запрещает путь наружу из каталога проекта («Readme path must be
# within the project directory»). Пакет никуда не публикуется, поле — метаданные.
# Замер: на чистом дереве (git worktree, CI) `uv sync --all-extras` падал на
# editable-сборке, то есть гейты и smoke не стартовали вовсе.
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "jinja2>=3.1",
  "soundfile>=0.12",
  "piper-tts>=1.2",
]

[project.optional-dependencies]
vad = ["onnxruntime>=1.20"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
    # Инструменты гейтов живут В МАНИФЕСТЕ, а не ставятся руками: гейт, чей
    # инструмент поставлен мимо манифеста, в CI не существует (cqg@1.43).
    "pip-audit>=2.7",      # deps-audit, python-половина
    "mutmut>=3.6",         # mutation — «тесты утверждают» (CQG §3.7)
    "detect-secrets>=1.5", # secrets-гейт §2.7
    "import-linter>=2.0",  # направление зависимостей
    "pytest-timeout>=2.4"  # уже стоял транзитивно; закрепляем явно,
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ещё два пути — стражи исполнения (CQG §2.7c, порт cqg@2.74): плагин лежит в
# `scripts/lint/`, а из `mutants/` (копия этого файла на уровень глубже) до него на
# один `..` дальше. Второй путь не опечатка: без него mutmut падает импортом плагина
# («No module named 'run_sentinels'»), и мутационный гейт не судит ничего. Под mutmut
# стражи молчат сами. Сам плагин грузит `-p run_sentinels` в `addopts` ниже.
pythonpath = [".", "../scripts/lint", "../../scripts/lint"]
# `mutants/` — условие работоспособности сьюта, а не косметика: мутационный гейт
# оставляет каталог с КОПИЕЙ tests/, и следующий pytest не СОБИРАЕТСЯ
# («import file mismatch»). Удалять каталог нельзя — `mutmut show` его читает.
norecursedirs = ["mutants", ".venv", "node_modules", "build", "dist"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--strict-markers",
  # Опечатка в ключе конфига — ошибка, а не молча проигнорированная строка (канон, порт 18.10).
  "--strict-config",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-fail-under=85",  # Phase 2 gate (doc 18)
  # Зависший тест обязан падать, а не молчать. WS-тесты на TestClient блокируются
  # навсегда, если сервер не прислал ожидаемый кадр: прогоны main от 2026-07-05
  # висели по 6 ч и отменялись по лимиту. Локально сьют идёт ~2 с, так что 60 с
  # на тест — это только про «повис», а не про «медленно».
  "--timeout=60",
  "--timeout-method=thread",
  # Стражи исполнения (CQG §2.7c): текст пользователя и значения секретов в логах,
  # соединения, не вернувшиеся в пул, — судятся исполнением сьюта. Текст
  # пользователя у нас рождается в распознавании речи, поэтому его метку несёт
  # фикстура `canary_text` через WS-вход (tests/test_ws_sentinels.py).
  "-p", "run_sentinels",
]
markers = [
  "integration: hits multiple layers (still mocked external AI)",
  "slow: manual or e2e; not run in default CI",
]
xfail_strict = true        # xfail, который вдруг прошёл, = сигнал, а не тишина

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/main.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["migrations", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","DTZ"]
# PLR1702 судит гейт сложности с `--preview`; хук идёт без preview и считает правило
# невключённым, поэтому `RUF100` объявил бы поштучный `noqa` на нём лишним, а
# `--fix` вырезал бы его (канон cqg@2.71, замер на ruff 0.6.9 и 0.16.6).
# `external` это снимает.
external = ["PLR1702"]
ignore = [
    "E501",                 # длину разрулит форматтер
    "S101",                 # assert разрешён
    # ⚠ Из bandit-семейства здесь РОВНО ДВА кода, у каждого причина «правило
    # неверно для штатной архитектуры», а не «шумит» (cqg@1.51). Прежде было
    # восемь одной строкой, и выключены были ровно те проверки, что судят вершину
    # списка типовых ошибок модели: md5/sha1 (S324), pickle (S301), random для
    # токена (S311), пароль строкой (S105/S106), команда из непроверенного
    # значения (S603). Escape — поштучный `# noqa: <CODE> -- <причина>`: он виден
    # в диффе, строка в ignore не видна нигде. У S324 escape лучше noqa и стоит
    # в коде: `hashlib.md5(data, usedforsecurity=False)`.
    "S104",   # bind 0.0.0.0 — в контейнере норма, иначе noqa на каждом entrypoint
    "S607",   # частичный путь: `git`/`npm` по имени штатно, абсолютный ХУЖЕ
    # Шесть комплексити-правил В IGNORE, потому что §5 разворачивает гейт
    # сложности: `check_complexity_gate.sh` сам сбрасывает ignore и сверяет
    # находки со СНИМКОМ (ратчет). Отдать их основному хуку — значит сделать
    # pre-commit красным НАВСЕГДА на любом легаси с одной сложной функцией.
    # PLR1702 (вложенность) — с cqg@2.71; список обязан совпадать с RULES гейта.
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702",
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default аргумента (напр. FastAPI Depends())
    "RUF001","RUF002","RUF003",  # ambiguous unicode — не-ASCII в строках/логах
    "PLC0415",              # import-outside-top-level — осознанный lazy-import паттерн
]
# tests-код имеет свои послабления:
# ASYNC добавлен к каноническому списку: тестовые фейки синхронно пишут файлы
# в async-методах, имитируя контракт реального декодера — это не блокирующий I/O в проде.
per-file-ignores = { "tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","PLR1702","C901","PLC0415","B017","PT011","PT012","PT018","N806","N803","N802","E402","SIM117","PT006","E741","PLW0108","DTZ","ASYNC"] }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 4      # PLR1702 — вложенность блоков (preview: гейт зовёт ruff с --preview)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "piper.*"
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "import-linter>=2.13",
  "pre-commit>=4.6.1",
  "detect-secrets>=1.5.0",
  "pytest-timeout>=2.4.0",
  "hypothesis>=6.100",
]

# --- mutmut: область мутационного гейта ---------------------------------------
# Без этой секции гейт `mutation` не судит вообще: у 3.x области нет флага, он
# берёт её отсюда. Значение — ИМЯ ПАКЕТА относительно каталога этого файла, а не
# путь от корня репозитория: ключ мутанта mutmut выводит из пути файла, и он
# обязан совпасть с тем, как пакет импортируют тесты (CQG §3.7).
[tool.mutmut]
source_paths = ["app"]
