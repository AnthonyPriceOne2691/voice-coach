# Mode 1 — Mock Interview behavioral contract (ABC-lite)
# Spec: docs/13-behavioral-contracts.md · checks map to modules in backend/app/contracts/rules/
mode: interview
version: "1.0"
enforcement: per_sentence   # sentence-gated streaming, see doc 13 "Runtime pipeline"

preconditions:
  - id: session_type
    check: session_type_is
    value: interview
  - id: profile_loaded
    check: knowledge_profile_loaded

invariants:
  hard:
    - id: I1-H1_en_only
      check: no_cyrillic          # regex [Ѐ-ӿ], per sentence
    - id: I1-H2_no_coaching
      check: forbid_patterns
      patterns_file: interview_forbidden.txt
    - id: I1-H3_no_scoring
      check: forbid_patterns
      patterns_file: interview_forbidden.txt   # scoring/debrief patterns included there
    - id: I1-H5_interviewer_role
      check: mode_persona
      persona: senior_colleague
  soft:
    - id: I1-S2_no_preamble
      check: preamble_before_question
      recovery: truncate_preamble
    - id: I1-S3_ack_before_followup
      check: ack_present_on_followup
      recovery: prepend_template
      template: "Got it."
    # I1-S1 (tone) — prompt-level only, NOT runtime-enforced in MVP (doc 13)

governance:
  hard:
    - id: G1-H1_max_sentences
      check: max_sentences
      max: 3
    - id: G1-H2_max_chars
      check: max_chars_cumulative
      max: 400
    - id: G1-H4_question_or_ack
      check: question_or_ack        # turn-level, evaluated at stream end
      states: [CORE_QUEST, FOLLOW_UP]
      ack_max_words: 12
      ack_whitelist_file: ack_whitelist.txt
      recovery: append_seed_question   # additive fix — nothing spoken is retracted
    # G1-H3 (max 2 follow-ups) enforced by orchestrator counter, not by text checks

recovery:
  max_retries: 1                 # Lemma 3.10: 1 retry + fallback linearizes compliance decay
  regenerate_prompt: strict_regenerate   # data/prompts (regeneration prompt, doc 16)
  fallback: orchestrator_template        # data/prompts/templates/contract_fallback.txt

drift:
  window: session
  thresholds:
    hard_violations_tighten: 3       # -> temperature 0.75 -> 0.5
    same_soft_violation_remind: 5    # -> system reminder in next call
    recovery_success_min: 0.5        # below -> fallback-only mode + UI warning

logging:
  pre_recovery: true    # violations recorded before recovery (transparency effect)
  sink: session_metadata
