# Mode 1 — Mock Interview behavioral contract (ABC-lite)
# Spec: docs/13-behavioral-contracts.md · проверки — backend/app/contracts/enforcer.py
# Какие ключи исполняет код, а какие только объявлены, держит сторож
# backend/tests/test_contract_keys.py: ключ без исполнителя — с пометкой здесь и причиной там.
mode: interview   # метка: ContractSpec.mode не читает никто, контракт сессии выбирает container.py по имени файла
version: "2.0"   # 2.0 — инверсия: тренер-помощник вместо экзаменатора (для человека, код не читает)
enforcement: per_sentence   # описание: енфорсер судит по предложениям всегда, значение не читается (doc 13 "Runtime pipeline")

# Предусловия не читаются из YAML: тип сессии выбирает обработчик сообщения, а
# profile_loaded не исполняется — без файла профиля промпт получает заглушку.
preconditions:
  - id: session_type
    check: session_type_is
    value: interview
  - id: profile_loaded
    check: knowledge_profile_loaded

invariants:
  hard:
    - id: I1-H1_en_only
      check: no_cyrillic          # regex [Ѐ-ӿ], per sentence
    # I1-H2 (no_coaching) СНЯТ 2026-08-12 решением человека: помощь, подсказка
    # и похвала — работа тренера, а не нарушение. Раньше енфорсер резал их до
    # озвучки, и барьер держала машина. История — docs/09, docs/13.
    - id: I1-H3_no_scoring
      check: forbid_patterns
      patterns_file: interview_forbidden.txt   # только баллы, рубрики, итоговый разбор
    - id: I1-H5_interviewer_role
      check: mode_persona     # декларативная: персона — в системном промпте, проверки нет
      persona: supportive_coach
  soft:
    # I1-S2 и I1-S3 декларативные: проверки нет, recovery и template не исполняются.
    - id: I1-S2_no_preamble
      check: preamble_before_question
      recovery: truncate_preamble
    - id: I1-S3_ack_before_followup
      check: ack_present_on_followup
      recovery: prepend_template
      template: "Got it."
    # I1-S1 (tone) — prompt-level only, NOT runtime-enforced in MVP (doc 13)
    # I1-S4 (готовность помочь, когда кандидат встал) — тоже prompt-level:
    # «доброту» машиной не проверить, проверяемо лишь отсутствие конкретных
    # конструкций. Живёт в data/prompts/interviewer_system.txt.

governance:
  hard:
    - id: G1-H1_max_sentences
      check: max_sentences
      max: 3
    - id: G1-H2_max_chars
      check: max_chars_cumulative
      max: 400
    - id: G1-H4_question_or_ack
      check: question_or_ack        # turn-level, evaluated at stream end
      states: [CORE_QUEST, FOLLOW_UP]
      ack_max_words: 12
      ack_whitelist_file: ack_whitelist.txt
      recovery: append_seed_question   # additive fix — дописывает seed turn_runner.py; значение не читается
    # G1-H3 (max 2 follow-ups) enforced by orchestrator counter, not by text checks

recovery:
  max_retries: 1                 # Lemma 3.10: 1 retry + fallback linearizes compliance decay
  # не исполняется: подсказка — константа STRICT_REGENERATE в voice/turn_runner.py (L73)
  regenerate_prompt: strict_regenerate
  # значение не читается: запасная реплика — seed плана оркестратора (turn_runner.py);
  # data/prompts/templates/contract_fallback.txt не читает никто
  fallback: orchestrator_template

# НЕ ИСПОЛНЯЕТСЯ: детектора дрейфа нет — пороги не считаются и ни на что не влияют
# (doc 13, «Drift detection»). Строить ли его — решение человека; до тех пор числа
# ниже — замысел, а не настройка.
drift:
  window: session
  thresholds:
    hard_violations_tighten: 3       # -> temperature 0.75 -> 0.5
    same_soft_violation_remind: 5    # -> system reminder in next call
    recovery_success_min: 0.5        # below -> fallback-only mode + UI warning

# Значения не читаются: счётчики нарушений (hard/soft/fallback) пишет в метаданные сессии
# voice/session_flow.py — до восстановления; сами события нарушений не сохраняются (doc 13).
logging:
  pre_recovery: true    # violations recorded before recovery (transparency effect)
  sink: session_metadata
