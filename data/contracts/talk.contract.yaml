# Talk — разговор с Генри, behavioral contract (ABC-lite), D3a
# Spec: docs/13-behavioral-contracts.md · delivery talk-server (2026-10-17)
# Какие ключи исполняет код, а какие только объявлены, держит сторож
# backend/tests/test_contract_keys.py: ключ без исполнителя — с пометкой здесь и причиной там.
mode: talk   # метка: ContractSpec.mode не читает никто
version: "1.0"   # для человека, код не читает
enforcement: per_sentence   # описание: значение не читается, енфорсер судит по предложениям всегда

# Предусловия не читаются из YAML: разговор открывает сообщение start_talk, а
# profile_loaded не исполняется — без файла профиля промпт получает заглушку.
preconditions:
  - id: session_type
    check: session_type_is
    value: talk
  - id: profile_loaded
    check: knowledge_profile_loaded

invariants:
  hard:
    - id: I3-H1_en_only
      check: no_cyrillic
    # Оценки нет никогда — ни балла, ни уровня, ни рубрики (решение человека
    # 2026-10-17). Держит енфорсер до озвучки, а не согласие модели (L24).
    # Похвала разрешена: «Your English sounds natural» — не оценка.
    - id: I3-H2_no_grades
      check: forbid_patterns
      patterns_file: talk_forbidden.txt
    - id: I3-H3_friend_mentor_role
      check: mode_persona     # декларативная: персона — в системном промпте, проверки нет
      persona: friend_mentor
  # I3-S1 (теплота, один вопрос в ответ) — prompt-level, advisory: машиной не
  # проверить. Живёт в data/prompts/talk_system.txt.

governance:
  hard:
    - id: G3-H1_max_sentences
      check: max_sentences
      max: 4
    - id: G3-H2_max_chars
      check: max_chars_cumulative
      max: 450
    # G3-H3 (тема, прощание, конец по времени) — структура, держит
    # orchestrator/talk.py, а не текстовая проверка.

recovery:
  max_retries: 1
  fallback: orchestrator_template   # значение не читается: seed плана — реплика `fallback` из data/talk/talk.yaml

# Значения не читаются: счётчики нарушений (hard/soft/fallback) пишет в метаданные сессии
# voice/session_flow.py — до восстановления; сами события нарушений не сохраняются (doc 13).
logging:
  pre_recovery: true
  sink: session_metadata
