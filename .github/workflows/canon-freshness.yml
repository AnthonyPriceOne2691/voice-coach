# .github/workflows/canon-freshness.yml
name: canon-freshness
on:
  schedule: [{cron: "0 7 * * 1"}]     # понедельник, 07:00 UTC
  workflow_dispatch:
# §8.7 мера 5: новый push отменяет предыдущий прогон ТОЙ ЖЕ ветки. Без этого
# три быстрых пуша подряд держат три прогона, и платятся все три. Группа по
# workflow+ref, а не по workflow: параллельные ветки друг друга не гасят.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/okf_sync_gate.py --check-stale
