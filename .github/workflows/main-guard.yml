# CQG §8.5.1 ④ — красное на main не остаётся тихим: открывается issue.
#
# АДАПТАЦИЯ ПРОЕКТА: канонический шаблон гоняет pre-commit сразу после checkout.
# Здесь так нельзя — хуки `language: system` зовут backend/.venv/bin/mypy и
# npx eslint, поэтому без установки зависимостей джоба падает с exit 127
# («нет бинаря»), а не на реальном нарушении, и открыла бы ЛОЖНЫЙ issue.
# Ставим то же и в том же порядке, что quality.yml.
name: main-guard
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
# §8.7 мера 5: новый push отменяет предыдущий прогон ТОЙ ЖЕ ветки. Без этого
# три быстрых пуша подряд держат три прогона, и платятся все три. Группа по
# workflow+ref, а не по workflow: параллельные ветки друг друга не гасят.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Имя в кавычках: незакавыченный скаляр с ": " YAML читает как вложенный
      # mapping, и весь workflow перестаёт парситься (гейт молча мёртв).
      - name: "Install deps (гейты используют language: system)"
        run: |
          (cd backend && uv sync --all-extras)
          (cd frontend && npm ci)

      - id: gates
        continue-on-error: true
        env:
          STRICT: "1"
          LINT_PY_SRC: backend/app
          LINT_FE_DIR: frontend
          LINT_BE_DIR: backend
          LINT_COV_PKG: app
        run: |
          pip install pre-commit
          pre-commit run --all-files
      - if: steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "RED on main: ${{ github.sha }}" \
            --body "Гейты на main красные. Слито мимо merge_guard.sh (CQG §8.5). Починить или откатить." \
            --label bug
      - if: steps.gates.outcome == 'failure'
        run: exit 1
